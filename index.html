<script>
"use strict";
/* ================= utilitaires ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>toISO(new Date());
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return toISO(d)};

function localBackend(){
  const mem={},subs={};
  const read=c=>{try{const s=localStorage.getItem('aos:'+c);return s?JSON.parse(s):(mem[c]||{})}catch(e){return mem[c]||{}}};
  const write=(c,o)=>{mem[c]=o;try{localStorage.setItem('aos:'+c,JSON.stringify(o))}catch(e){}(subs[c]||[]).forEach(f=>f())};
  return{mode:'local',
    async list(c){return Object.entries(read(c)).map(([id,d])=>({id,...d}))},
    async set(c,id,d){const o=read(c);o[id]=d;write(c,o)},
    async update(c,id,p){const o=read(c);o[id]={...(o[id]||{}),...p};write(c,o)},
    async del(c,id){const o=read(c);delete o[id];write(c,o)},
    async setMany(c,items){const o=read(c);items.forEach(([id,d])=>{o[id]=d});write(c,o)},
    watch(c,f){(subs[c]=subs[c]||[]).push(f)}};
}
function cloudBackend(sb){
  return{mode:'cloud',sb,
    async list(c){let out=[],from=0;for(;;){const{data,error}=await sb.from(c).select('id,data').range(from,from+999);if(error)throw error;out=out.concat(data.map(r=>({id:r.id,...r.data})));if(data.length<1000)break;from+=1000}return out},
    async set(c,id,d){const{error}=await sb.from(c).upsert({id,data:d});if(error)throw error},
    async update(c,id,p){const{error}=await sb.rpc('fusion_doc',{t:c,doc_id:id,patch:p});if(error)throw error},
    async del(c,id){const{error}=await sb.from(c).delete().eq('id',id);if(error)throw error},
    async setMany(c,items){for(let i=0;i<items.length;i+=400){const{error}=await sb.from(c).upsert(items.slice(i,i+400).map(([id,d])=>({id,data:d})));if(error)throw error}},
    watch(c,f){sb.channel('rt-'+c).on('postgres_changes',{event:'*',schema:'public',table:c},f).subscribe()}};
}

async function callResult(r){
  const p=byId(S.call.pid);if(!p)return;
  const sc=settings();
  const note=($('#cn')||{}).value||'',obj=($('#co')||{}).value||'—',audio=($('#ca')||{}).value||'',informed=!!($('#ci')||{}).checked;
  const date=($('#cd')||{}).value||workday(2),rdvAt=($('#cr')||{}).value||'';
  if(r==='rdv'&&!rdvAt){toast('Renseigne la date et l\'heure du RDV.');return}
  const now=new Date();
  const call={channel:'appel',prospectId:p.id,prospectName:p.name,t:now.toISOString(),hour:now.getHours(),result:r,angle:S.call.angle||sc.angle,obj:obj==='—'?'':obj,note,audio,informed,dept:p.dept||'',joint:JOINT.includes(r)};
  const id='c'+uid();
  const touches=(p.touches||0)+1;
  const base={touches,lastCall:call.t,lastResult:r,notes:note?((p.notes?p.notes+'\n':'')+today()+' : '+note):(p.notes||'')};
  let patch;
  if(r==='rdv')patch={...base,stage:'rdv',rdvAt,nextDate:''};
  else if(r==='rap')patch={...base,stage:'contacte',nextDate:date};
  else if(r==='nr'||r==='rep'){const joined=callsOf(p.id).some(c=>c.joint);const ctries=callsOf(p.id).filter(c=>isCall(c)&&(!p.cycleStart||c.t>=p.cycleStart)).length+1;
    const slots=['m','d','s'].filter(x=>x!==slotOf(call.hour));
    if(ctries>=MAX_TRIES&&!joined){patch=(p.cycle||1)<2?{...base,stage:'contacte',nextDate:addDays(today(),30),slots:[],cycle:2,cycleStart:new Date(now.getTime()+1).toISOString()}:{...base,stage:'perdu',lostReason:'Injoignable (2 cycles de '+MAX_TRIES+' tentatives)'}}
    else patch={...base,stage:'contacte',nextDate:workday(r==='nr'?1:2),slots}}
  else if(r==='hu'){const hus=callsOf(p.id).filter(c=>c.result==='hu').length+1;patch=hus>=2?{...base,stage:'perdu',lostReason:'A raccroché au nez (2 fois)'}:{...base,stage:'contacte',nextDate:workday(3),slots:['m','d','s'].filter(x=>x!==slotOf(call.hour))}}
  else if(r==='no')patch={...base,stage:'perdu',lostReason:call.obj||'Pas intéressé'};
  else if(r==='bad')patch={...base,phone:'',badPhone:true};
  else patch={...base,stage:'stop',optout:true};
  const ok=await guard(async()=>{await DB.set('calls',id,call);await DB.update('prospects',p.id,patch)});
  if(ok){S.calls.push({id,...call});Object.assign(p,patch);S.call.pid='';S.call.open='';S.call.q='';if(r==='nr')S.lastNR=p.id;if(r==='rdv')S.lastRDV=p.id;
    const nth=touches===1?'1er appel':touches+'e appel',tr=callsOf(p.id).filter(c=>isCall(c)&&(!p.cycleStart||c.t>=p.cycleStart)).length;
    const nxt=patch.stage==='perdu'?'fiche classée perdue':patch.stage==='stop'?'ne plus appeler':patch.stage==='rdv'?'RDV pris':patch.nextDate?'prochain essai le '+fdate(patch.nextDate):'';
    S.lastRes=`<b>${esc(p.name)}</b> : ${esc(RES_L[r])} · ${nth}${(r==='nr'||r==='rep')&&!callsOf(p.id).some(c=>c.joint)?' ('+tr+'/'+MAX_TRIES+' dans cette série)':''}${nxt?' · '+nxt:''}`;
    toast(RES_L[r]+' enregistré · '+nth+(nxt?' · '+nxt:''));render()}
}

const EFF_L={'00':'0 salarié','01':'1-2 salariés','02':'3-5 salariés','03':'6-9 salariés','11':'10-19 salariés','12':'20-49 salariés','21':'50-99 salariés','22':'100-199 salariés'};

function sectorOf(p){
  if(p.naf)return NAF_L[p.naf]||('NAF '+p.naf);

  if(/chauff|chaudi|thermi|pompe|poêle|poele|énergie|energie/i.test(n))return 'Chauffage / énergie';

async function outResult(r){

  const call={channel:ch,prospectId:p.id,prospectName:p.name,t:now.toISOString(),hour:now.getHours(),result:r,angle:S.out.variant,obj:'',note,audio:ch==='video'?handle:'',informed:false,dept:p.dept||'',joint:OUT_JOINT.includes(r)};

  let patch;
  if(r==='sent'){const tries=outTries(p)+1;patch={...base,stage:p.stage==='a_contacter'?'contacte':p.stage,outNext:workday(3)};if(tries>=MAX_OUT)patch.outDone=true;

function weekStart(d){const x=new Date(d+'T12:00:00');return addDays(d,-((x.getDay()+6)%7))}
const REC_M=[['n','Appels'],['j','Conversations'],['r','RDV'],['dm','Messages (DM, mail)'],['v','Vidéos'],['ct','Contenus']];
function periodAgg(){
  const A={D:{},W:{},M:{}};
  const add=(d,f)=>[['D',d],['W',weekStart(d)],['M',d.slice(0,7)]].forEach(([p,k])=>{const x=A[p][k]=A[p][k]||{n:0,j:0,r:0,dm:0,v:0,ct:0};x[f]++});
  S.calls.forEach(c=>{const d=String(c.t).slice(0,10);if(isCall(c)){add(d,'n');if(c.joint)add(d,'j')}else if(c.result==='sent')add(d,c.channel==='video'?'v':'dm');if(c.result==='rdv')add(d,'r')});
  S.content.forEach(c=>{if(c.d)add(String(c.d).slice(0,10),'ct')});
  return A;
}
function recInfo(A,p,f){
  const t=today(),ck=p==='D'?t:p==='W'?weekStart(t):t.slice(0,7);
  const cur=(A[p][ck]||{})[f]||0;
  let best=0,bk='';Object.entries(A[p]).forEach(([k,v])=>{if(k!==ck&&(v[f]||0)>best){best=v[f];bk=k}});
  const isRec=cur>0&&cur>best;
  const end=!bk?'':p==='D'?bk:p==='W'?addDays(bk,6):toISO(new Date(+bk.slice(0,4),+bk.slice(5,7),0,12));
  const since=end?Math.max(0,Math.round((new Date(t+'T12:00:00')-new Date(end+'T12:00:00'))/864e5)):0;
  return {cur,best,bk,isRec,since};
}
const sinceTxt=n=>n===0?'égalé aujourd\'hui':n===1?'depuis hier':'il y a '+n+' jours';
function recordsHTML(){
  const A=periodAgg();
  const lbl=(p,k)=>p==='D'?fdate(k):p==='W'?'sem. du '+fdate(k):new Date(k+'-15T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const cell=(p,f)=>{const r=recInfo(A,p,f);return `<td class="r"><b>${r.cur}</b> <span class="muted sm">/ ${Math.max(r.best,r.cur)}</span><div class="sm ${r.isRec?'':'muted'}">${r.isRec?'🏆 record battu':r.best?'record '+sinceTxt(r.since)+' · '+esc(lbl(p,r.bk)):'—'}</div></td>`};
  const rows=REC_M.map(([f,l])=>`<tr><td><b>${l}</b></td>${cell('D',f)}${cell('W',f)}${cell('M',f)}</tr>`).join('');
  return `<section class="card"><h3>Tes records à battre</h3><div class="scroll-x"><table class="t"><thead><tr><th></th><th class="r">Jour</th><th class="r">Semaine</th><th class="r">Mois</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted sm">En gras : ton score en cours. Après « / » : ton meilleur score. Dessous : depuis combien de temps tu ne l'as pas battu. Semaine = du lundi au dimanche.</p></section>`;
}
const EGO=[
  (r,y)=>`Le record est à ${r}. Hier : ${y}. Tu t'en contentes ?`,
  r=>`Personne ne va faire ces appels à ta place. Vise ${r+1}.`,
  r=>`Un record qui dure, c'est une limite que tu t'es fixée toi-même. ${r+1} aujourd'hui.`,

function challengeHTML(){
  const A=periodAgg(),t=today(),y=(A.D[addDays(t,-1)]||{}).n||0;

  <div class="sm" style="display:grid;gap:6px;margin:12px 0">${line('Appels · semaine',w)}${line('Appels · mois',m)}${others}</div>

}

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;text=text.replace(/^﻿/,'');
  const delim=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===delim){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}else cur+=c}
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);return rows;
}
const HMAP={name:['name','nom','entreprise','displayname'],phone:['phone','telephone','téléphone','tel'],website:['website','site','url'],rating:['rating','note'],reviews:['reviews','avis','userratingcount'],address:['address','adresse'],city:['city','ville'],dept:['dept','departement','département'],placeId:['place_id','placeid','id'],mapsUrl:['maps_url','mapsurl','googlemapsuri'],score:['score'],email:['email','mail']};
async function importCSV(text){
  const rows=parseCSV(text);if(rows.length<2){toast('Fichier vide.');return}
  const hdr=rows[0].map(h=>h.trim().toLowerCase());const idx={};
  Object.entries(HMAP).forEach(([k,al])=>{const i=hdr.findIndex(h=>al.includes(h));if(i>=0)idx[k]=i});
  if(idx.name==null){toast('Colonne « name » introuvable.');return}
  const have=new Set(S.prospects.map(p=>p.id));const phones=new Set(S.prospects.map(p=>normPhone(p.phone)).filter(Boolean));
  const items=[];let dup=0,nophone=0;
  rows.slice(1).forEach(r=>{const g=k=>idx[k]!=null?(r[idx[k]]||'').trim():'';
    const name=g('name');if(!name)return;const phone=g('phone');
    if(!hasPhone(phone)){nophone++;return}
    const np=normPhone(phone);const id=g('placeId')?'g'+g('placeId'):'t'+np;

    items.push([id,{name,phone,website:g('website'),rating:g('rating'),reviews:+g('reviews')||0,address:g('address'),city:g('city'),dept,mapsUrl:g('mapsUrl'),score:+g('score')||0,email:g('email'),stage:'a_contacter',created:today(),source:'import'}]);
  });
  if(await guard(()=>DB.setMany('prospects',items))){items.forEach(([id,d])=>S.prospects.push({id,...d}));toast(items.length+' fiches ajoutées, '+dup+' doublons ignorés, '+nophone+' sans téléphone.');render()}
}
function mergeNew(items,have,phones,mk){/* utilitaire de dédoublonnage */}
const dupKeys=p=>{const k=[];const ph=normPhone(p.phone);if(ph)k.push('t'+ph);if(p.siren)k.push('s'+p.siren);if(p.name&&p.city)k.push('n'+String(p.name).toLowerCase().replace(/[^a-z0-9]/g,'')+'|'+String(p.city).toLowerCase())+'';return k};
const isDup=p=>p.stage==='perdu'&&p.lostReason==='Doublon';
async function addProspects(items){
  if(!items.length)return 0;
  const idx=new Map();S.prospects.forEach(p=>{if(!isDup(p))dupKeys(p).forEach(k=>{if(!idx.has(k))idx.set(k,p)})});
  const fresh=[];let merged=0;
  for(const it of items){
    const d=it[1];const keys=dupKeys(d);const hit=keys.map(k=>idx.get(k)).find(Boolean);
    if(hit){
      if(hit.enrich==='todo'&&!hasPhone(hit.phone)&&hasPhone(d.phone)){
        const patch={phone:d.phone,email:d.email||hit.email||'',website:d.website||hit.website||'',address:d.address||hit.address,enrich:'done',score:Math.max(hit.score||0,d.score||0)};
        if(await guard(()=>DB.update('prospects',hit.id,patch))){Object.assign(hit,patch);keys.forEach(k=>idx.set(k,hit));merged++}
      }
      continue;
    }
    keys.forEach(k=>idx.set(k,{id:it[0]}));fresh.push(it);
  }
  let n=0;
  if(fresh.length&&await guard(()=>DB.setMany('prospects',fresh))){fresh.forEach(([id,d])=>S.prospects.push({id,...d}));n=fresh.length}
  return n+merged;
}
async function cleanDupes(){
  const seen=new Map();let n=0;
  const list=[...S.prospects].filter(p=>!isDup(p)).sort((a,b)=>(hasPhone(b.phone)?1:0)-(hasPhone(a.phone)?1:0)||(callsOf(b.id).length-callsOf(a.id).length)||String(a.created).localeCompare(String(b.created)));
  for(const p of list){
    const keys=dupKeys(p);const hit=keys.map(k=>seen.get(k)).find(Boolean);
    if(hit){const patch={stage:'perdu',lostReason:'Doublon',optout:p.optout||false};if(await guard(()=>DB.update('prospects',p.id,patch))){Object.assign(p,patch);n++}}
    else keys.forEach(k=>seen.set(k,p));
  }

}

async function sourceGouv(){
  const scope=($('#osmscope')||{}).value||'idf';const depts=scopeDepts(scope);
  const btn=$('#govbtn');if(btn)btn.disabled=true;
  const have=new Set(S.prospects.map(p=>p.id));let added=0,errs=0;
  for(let i=0;i<depts.length;i++){
    const d=depts[i];const items=[];
    for(const naf of ['43.22A','43.22B']){
      for(let page=1;page<=400;page++){
        if(btn)btn.textContent='Annuaire officiel : département '+d+' ('+(i+1)+'/'+depts.length+'), '+naf+' page '+page+'…';
        try{
          const r=await fetch('https://recherche-entreprises.api.gouv.fr/search?activite_principale='+naf+'&departement='+d+'&etat_administratif=A&per_page=25&page='+page);
          if(r.status===429){await sleep(2500);page--;continue}
          if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();const res=j.results||[];
          res.forEach(x=>{const id='s'+x.siren;if(have.has(id))return;have.add(id);
            const sg=x.siege||{};const dir=(x.dirigeants||[]).find(z=>z.prenoms&&z.nom);
            items.push([id,{name:titleCase(cleanName(x.nom_complet)),phone:'',website:'',city:titleCase(sg.libelle_commune||''),dept:d,address:[sg.adresse].filter(Boolean).join(' '),dirigeant:dir?titleCase(String(dir.prenoms).split(/[\s,]+/)[0]+' '+dir.nom):'',created_co:x.date_creation||'',effectif:x.tranche_effectif_salarie||'',siren:x.siren,score:30+(x.date_creation&&+String(x.date_creation).slice(0,4)>=new Date().getFullYear()-2?20:0),stage:'a_contacter',created:today(),source:'gouv',enrich:'todo'}]);
          });
          if(res.length<25||page>=j.total_pages)break;
          await sleep(160);
        }catch(err){errs++;break}
      }
    }
    added+=await addProspects(items);
  }
  toast(added+' entreprises ajoutées depuis l\'annuaire officiel'+(errs?' ('+errs+' erreurs, relance plus tard)':'')+'. Elles n\'ont pas encore de téléphone ni de compte : voir « À enrichir ».');
  render();
}
const RGE_RE=/chaudi|chauffage|pompe à chaleur|poêle|chauffe-eau|radiateur/i;
async function sourceRGE(){
  const scope=($('#osmscope')||{}).value||'idf';const depts=scopeDepts(scope);
  const btn=$('#rgebtn');if(btn)btn.disabled=true;
  const have=new Set(S.prospects.map(p=>p.id));const phones=new Set(S.prospects.map(p=>normPhone(p.phone)).filter(Boolean));
  const sel='siret,nom_entreprise,adresse,code_postal,commune,telephone,email,site_internet,domaine';
  let added=0,dup=0,errs=0;
  for(let i=0;i<depts.length;i++){
    const d=depts[i];const pre=(d==='2A'||d==='2B')?'20':d;const m=new Map();
    let url='https://data.ademe.fr/data-fair/api/v1/datasets/eo1n335dwa-ul7glxa7lm1ho/lines?size=1000&select='+sel+'&qs='+encodeURIComponent('code_postal:'+pre+'*');
    try{
      for(let page=1;url&&page<=30;page++){
        if(btn)btn.textContent='Fichier RGE : département '+d+' ('+(i+1)+'/'+depts.length+'), page '+page+'…';
        const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
        (j.results||[]).forEach(x=>{if(!x.siret||!RGE_RE.test(x.domaine||''))return;if(!m.has(x.siret))m.set(x.siret,x)});
        url=(j.results||[]).length<1000?null:j.next;await sleep(150);
      }
      const items=[];
      m.forEach(x=>{const id='r'+x.siret;const np=normPhone(x.telephone);
        if(have.has(id)||(np&&phones.has(np))){dup++;return}have.add(id);if(np)phones.add(np);
        const web=/qualit-enr\.org|qualibat|qualifelec|qualigaz|ademe\.fr|pagesjaunes|societe\.com|pappers|facebook\.com|instagram\.com|linkedin\.com/i.test(x.site_internet||'')?'':(x.site_internet||'');
        items.push([id,{name:titleCase(cleanName(x.nom_entreprise)),phone:hasPhone(x.telephone)?x.telephone:'',email:x.email||'',website:web,city:titleCase(x.commune||''),dept:String(x.code_postal||'').slice(0,2)||d,address:[x.adresse,x.code_postal].filter(Boolean).join(' '),siren:String(x.siret).slice(0,9),score:50+(hasPhone(x.telephone)?20:0)+(x.email?10:0)+(web?5:0),stage:'a_contacter',created:today(),source:'rge'}]);
      });
      added+=await addProspects(items);
    }catch(err){errs++}
  }
  toast(added+' entreprises chauffage/plomberie RGE ajoutées, '+dup+' doublons'+(errs?', '+errs+' départements en erreur (relance)':'')+'.');
  render();
}

<li><b>Enregistrement</b> : annonce-le en début d'appel (phrase dans Réglages).</li></ul></details>
</div><div class="card"><h2>Explication de l'outil</h2>
<h3>Appels</h3><p><b>À quoi ça sert :</b> appeler la liste, une fiche à la fois, et tout enregistrer.</p><ol class="plain"><li>Lis la fiche et le script de l'angle choisi.</li><li>Appelle (clique le numéro).</li><li>Note ce que tu apprends, choisis l'objection, puis clique le résultat.</li><li>La fiche suivante arrive toute seule.</li></ol><p class="muted sm">Bon à savoir : « Pas de réponse » reprogramme l'appel au prochain jour ouvré ; après ${MAX_TRIES} tentatives sans jamais joindre, la fiche part en réserve 30 jours (« Rappel de réserve »), puis une 2e série de ${MAX_TRIES} tentatives ; elle ne passe en « Perdu » qu'ensuite. Chaque rappel est proposé à un autre moment de la journée que le précédent.</p>
<h3>Enregistrement</h3><p class="muted sm">Dis la phrase d'information au début de l'appel, coche la case, colle le lien de l'audio (Drive). Garde les enregistrements au plus quelques mois. Je ne suis pas juriste : fais valider le cadre légal (appels, enregistrement, mobiles d'indépendants).</p>
<h3>DM &amp; vidéos</h3><p><b>À quoi ça sert :</b> les deux autres canaux de Hamza : message privé (Instagram, Facebook, LinkedIn), vidéo personnalisée, email.</p><ol class="plain"><li>Choisis le canal et le message ; le texte se remplit avec les infos de la fiche.</li><li>Copie le message, envoie-le sur la plateforme, colle le compte (ou le lien de la vidéo).</li><li>Clique « Envoyé » : la relance revient après 3 jours ouvrés, 4 envois maximum.</li><li>Si la personne répond, clique « A répondu » puis passe à l'appel.</li></ol><p class="muted sm">Pas de faux profil, pas de fausse référence, pas de promesse de chantiers.</p>
<h3>Contenu</h3><p>Note chaque publication (accroche, vues, messages reçus, RDV) pour savoir quelles accroches font venir des prospects.</p>
<h3>Pipeline</h3><p>Toutes les fiches par étape. Ouvre une fiche pour corriger, ajouter une note ou la passer en « Signé ».</p>
<h3>Clients</h3><p>Une fois « Signé », crée le client : liste de mise en place, saisie des résultats chaque semaine, coût par lead, alerte de revue à J+14.</p>
<h3>Stats</h3><p>Appels → conversations → RDV → signés, par angle de script, par heure, par département. Attends 30 conversations avant de comparer deux angles.</p>
<h3>Scripts</h3><p>Modifie les scripts et les prix. Crée un nouvel angle plutôt que d'écraser l'ancien.</p>
<h3>Données</h3><p>Import de la liste (CSV du script de recherche), exports, passage en cloud.</p></div>`}


/* ================= aujourd'hui : non-négociables ================= */
const DEF_GOALS={calls:[70,100],dm:[40,70],videos:[10,15],content:[1,2]};
const DAILY_CHECKS=[['liste','Liste de demain préparée (au moins 100 fiches appelables)'],['relances','Relances et rappels du jour traités'],['debrief','Débrief 5 min : une note par conversation + l\'objection du jour'],['rdvconf','Rappel du matin fait pour chaque RDV du jour']];
const goals=()=>({...DEF_GOALS,...(S.settings.goals||{})});
function todayCounts(){
  const t=today();const L=S.calls.filter(c=>String(c.t).slice(0,10)===t);
  const out=L.filter(c=>!isCall(c));
  return {calls:L.filter(isCall).length,dm:out.filter(c=>c.result==='sent'&&c.channel!=='video').length,videos:out.filter(c=>c.result==='sent'&&c.channel==='video').length,content:S.content.filter(c=>c.d===t).length,rdv:L.filter(c=>c.result==='rdv').length,conv:L.filter(c=>c.joint).length}
}
function heroHTML(){
  const n=todayCounts(),g=goals(),d=new Date();
  const act=S.clients.filter(c=>c.status!=='fini');const mrr=act.reduce((s,c)=>s+(+c.price||0)/3,0);
  const dateTxt=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const left=Math.max(0,Math.ceil((new Date('2027-01-31T23:59:00')-d)/864e5));
  const pct=Math.min(100,Math.round(100*mrr/10000));
  const Q=['Chaque appel est un pas vers le prochain rendez-vous.','Le volume fait le talent : appelle.','La régularité dépasse l\'intensité.','Un « non » est une donnée, pas un échec.','Tu construis une entreprise, pas une journée.','Concentre-toi sur la prochaine conversation.','Ce que tu fais aujourd\'hui fera ton chiffre de demain.'];
  const q=Q[Math.floor(d/864e5)%Q.length];
  return `<section class="hero"><div><div class="kick">${esc(dateTxt)} · J-${left}</div><h1>Cap sur <em>10&nbsp;000&nbsp;€</em> par mois.</h1><p>${esc(q)}</p></div>
  <div class="stats"><div class="st"><b>${n.calls}<small class="muted" style="font-size:15px"> / ${g.calls[0]}</small></b><span>Appels du jour</span></div><div class="st"><b>${n.rdv}</b><span>RDV pris</span></div>
  <div class="st goal"><div class="row" style="justify-content:space-between"><span>CA mensuel moyen</span><span><b style="display:inline;font-size:15px">${esc(money(mrr))}</b> <span>/ 10 000 €</span></span></div><div class="track"><i style="width:${pct}%"></i></div></div></div></section>`;
}
function aujourdhuiHTML(){
  const g=goals(),n=todayCounts(),t=today();const done=((S.settings.checks||{})[t])||{};
  const rows=[['calls','Appels','appels','Appeler'],['dm','Messages envoyés (DM, mail)','outreach','Envoyer'],['videos','Vidéos personnalisées','outreach','Envoyer'],['content','Contenus publiés','contenu','Publier']];
  const bar=(v,[min,max])=>{const pm=Math.min(100,Math.round(100*v/min)),px=Math.min(100,Math.round(100*v/max));return `<div style="background:var(--line,#ddd);border-radius:6px;height:12px;position:relative;overflow:hidden"><div style="position:absolute;inset:0 auto 0 0;width:${px}%;background:var(--ok,#2a7);opacity:.35"></div><div style="position:absolute;inset:0 auto 0 0;width:${Math.min(pm,px)}%;background:var(--ok,#2a7)"></div></div>`};
  const lines=rows.map(([k,l])=>{const v=n[k],[mn,mx]=g[k];const st=v>=mx?'🏆 reach atteint':v>=mn?'✅ minimum fait':`encore ${mn-v}`;return `<div style="margin:12px 0"><div class="row" style="justify-content:space-between"><b>${l}</b><span><b>${v}</b> / ${mn} <span class="muted sm">(reach ${mx})</span> · ${st}</span></div>${bar(v,[mn,mx])}</div>`}).join('');
  const nextRow=rows.find(([k])=>n[k]<g[k][0]);
  const nxt=nextRow?`<button class="btn primary" style="width:100%;font-size:1.2em;padding:16px" data-act="tab" data-v="${nextRow[2]}">${nextRow[3]} : encore ${g[nextRow[0]][0]-n[nextRow[0]]} ${nextRow[1].toLowerCase()} →</button>`:`<div class="banner">Tous les minimums sont faits. Vise le reach, puis prépare la liste de demain.</div>`;
  const minOK=rows.every(([k])=>n[k]>=g[k][0]);
  const ch=DAILY_CHECKS.map(([k,l])=>`<label style="display:block;margin:8px 0"><input type="checkbox" data-act="tchk" data-k="${k}"${done[k]?' checked':''}> ${esc(l)}</label>`).join('');
  const chOK=DAILY_CHECKS.every(([k])=>done[k]);
  const kp=`<div class="kpis"><div class="kpi"><b>${n.conv}</b><span>conversations</span></div><div class="kpi"><b>${n.rdv}</b><span>RDV pris</span></div><div class="kpi"><b>${outQueue().length}</b><span>à contacter</span></div><div class="kpi"><b>${callQueue().length}</b><span>à appeler</span></div></div>`;
  const gi=Object.keys(DEF_GOALS).map(k=>`<label class="sm">${k==='calls'?'Appels':k==='dm'?'Messages':k==='videos'?'Vidéos':'Contenus'} <input type="number" min="0" style="width:60px" id="g-${k}-0" value="${g[k][0]}"> minimum <input type="number" min="0" style="width:60px" id="g-${k}-1" value="${g[k][1]}"> reach</label>`).join('<br>');
  return heroHTML()+`<div class="card"><h2>Aujourd'hui · ${t}</h2><p class="muted sm">Minimum = non négociable (BAM). Reach = ce que tu vises. Les compteurs se remplissent tout seuls quand tu enregistres un résultat. Pas besoin de réfléchir : fais le bouton du bas.</p>${lines}${nxt}<p style="margin-top:12px"><b>${minOK&&chOK?'✅ Journée validée.':minOK?'Minimums faits : reste la checklist.':'Journée pas encore validée.'}</b></p></div>${kp}${bilanHTML()}
  <div class="card"><h3>Checklist du jour</h3>${ch}</div>
  <details class="card"><summary><b>Modifier les objectifs</b></summary><p>${gi}</p><button class="btn sm" data-act="goals-save">Enregistrer les objectifs</button></details>`;
}
async function toggleDaily(k,on){
  const t=today();const checks={...(S.settings.checks||{})};checks[t]={...(checks[t]||{}),[k]:on};
  if(await guard(()=>DB.update('settings','main',{checks}))){S.settings.checks=checks;render()}
}
async function saveGoals(){
  const gl={};Object.keys(DEF_GOALS).forEach(k=>{const a=+$('#g-'+k+'-0').value||0,b=Math.max(a,+$('#g-'+k+'-1').value||0);gl[k]=[a,b]});
  if(await guard(()=>DB.update('settings','main',{goals:gl}))){S.settings.goals=gl;toast('Objectifs enregistrés.');render()}
}

/* ================= rendu ================= */
const TABS=[['auj','Aujourd\'hui'],['appels','Appels'],['outreach','DM & vidéos'],['contenu','Contenu'],['pipeline','Pipeline'],['clients','Clients'],['stats','Stats'],['scripts','Scripts'],['donnees','Données'],['aide','Explication']];
function render(){
  const app=$('#app');
  if(DB.mode==='cloud'&&!S.user){loginHTML();return}
  const active=document.activeElement&&document.activeElement.id;
  let body='';
  if(!S.loaded)body='<div class="card">Chargement…</div>';
  else if(S.err)body=`<div class="banner">Erreur de données : ${esc(S.err)}</div>`;
  else body={auj:aujourdhuiHTML,appels:appelsHTML,outreach:outreachHTML,contenu:contenuHTML,pipeline:pipelineHTML,clients:clientsHTML,stats:statsHTML,scripts:scriptsHTML,donnees:donneesHTML,aide:aideHTML}[S.tab]();
  document.querySelectorAll('.chal').forEach(x=>x.remove());
  app.innerHTML=`<header class="top"><span class="brand"><i class="logo" aria-hidden="true">↗</i><span>AGENCY<b>OS</b></span></span><nav class="tabs" role="tablist">${TABS.map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k}" data-act="tab" data-v="${k}">${l}</button>`).join('')}</nav>${DB.mode==='cloud'?'<button class="btn sm" data-act="logout">Déconnexion</button>':'<span class="chip">Mode local</span>'}</header><main>${body}</main>`;
  if(S.chal&&S.loaded&&!S.err)document.body.insertAdjacentHTML('beforeend',challengeHTML());
  if(S.tab==='scripts'&&S.loaded){const m=$('main');m.insertAdjacentHTML('beforeend','<p><button class="btn sm" data-act="addangle">+ Nouvel angle de script</button></p>')}
  if(active&&$('#'+active)&&['cn','pq','on','oh','cq'].includes(active)){const el=$('#'+active);el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}
}
function loginHTML(){
  $('#app').innerHTML=`<div class="login card"><div class="brand"><i class="logo" aria-hidden="true">↗</i><span>AGENCY<b>OS</b></span></div><h2>Ton poste de commande</h2><label class="f" for="lgm">Email</label><input id="lgm" type="email" style="width:100%" autocomplete="username"><label class="f" for="lgp">Mot de passe</label><input id="lgp" type="password" style="width:100%" autocomplete="current-password"><div style="margin-top:12px"><button class="btn primary" data-act="login">Connexion</button></div><p id="lge" class="sm" style="color:var(--bad)"></p></div>`;
}

/* ================= événements ================= */

  const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.act;
  if(a==='callopen'){S.call.open=b.dataset.id;S.call.pid=b.dataset.id;S.call.q='';S.call.note='';S.call.obj='—';S.call.audio='';S.call.rdvAt='';S.call.date='';render();window.scrollTo(0,0)}
  else if(a==='callclose'){S.call.open='';S.call.pid='';render()}
  else if(a==='chal-ok'){S.chal=false;S.tab='appels';render()}
  else if(a==='tab'){S.tab=b.dataset.v;render()}
  else if(a==='callres')callResult(b.dataset.r);
  else if(a==='outres')outResult(b.dataset.r);
  else if(a==='outskip'){if(S.out.pid)S.out.skip.push(S.out.pid);S.out.pid='';render()}
  else if(a==='copy'){const t=($('#otext')||{}).textContent||'';try{await navigator.clipboard.writeText(t);toast('Message copié.')}catch(e){toast('Copie impossible : sélectionne le texte.')}}
  else if(a==='ct-add')addContent();
  else if(a==='callskip'){if(S.call.pid&&!S.call.open)S.call.skip.push(S.call.pid);S.call.pid='';S.call.open='';render()}
  else if(a==='open')openProspect(b.dataset.id);
  else if(a==='close')$('#dlg').close();
  else if(a==='savep')saveProspectDlg(b.dataset.id);
  else if(a==='newp')newProspectDlg();
  else if(a==='np-save')addProspect();
  else if(a==='mkclient')makeClient(b.dataset.id);
  else if(a==='cli-open'){$('#dlg').open&&$('#dlg').close();S.tab='clients';S.cl.open=b.dataset.id;render()}
  else if(a==='cli-close'){S.cl.open='';render()}
  else if(a==='cli-save')saveClient(b.dataset.id);
  else if(a==='met-add')addMetric(b.dataset.id);
  else if(a==='set-save')saveSettings();
  else if(a==='addangle')addAngle();
  else if(a==='demo')loadDemo();
  else if(a==='goals-save')saveGoals();
  else if(a==='dedupe')cleanDupes();
  else if(a==='rdvdone'){S.lastRDV='';render()}
  else if(a==='nrdone'){const p=byId(S.lastNR);if(p&&b.tagName==='A'){DB.update('prospects',p.id,{nrSent:(p.nrSent||0)+1});p.nrSent=(p.nrSent||0)+1}S.lastNR='';setTimeout(render,50)}
  else if(a==='osm')sourceOSM();
  else if(a==='gouv')sourceGouv();
  else if(a==='rge')sourceRGE();
  else if(a==='exp-calls')exportCalls();
  else if(a==='exp-pros')exportProspects();
  else if(a==='logout'){await DB.sb.auth.signOut();S.user=null;render()}
  else if(a==='login'){const {data,error}=await DB.sb.auth.signInWithPassword({email:$('#lgm').value.trim(),password:$('#lgp').value});if(error){$('#lge').textContent='Connexion impossible : '+error.message;return}S.user=data.user;await start()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='cang'){S.call.angle=t.value;const keep={note:$('#cn')?$('#cn').value:'',obj:$('#co')?$('#co').value:'—',audio:$('#ca')?$('#ca').value:'',informed:$('#ci')?$('#ci').checked:false};Object.assign(S.call,keep);render()}
  else if(t.dataset&&t.dataset.act==='mobsel'){S.call.mob=t.value;S.call.pid='';render()}
  else if(t.id==='och'||t.id==='ovar'){S.out.note=$('#on')?$('#on').value:S.out.note;S.out.handle='';if(t.id==='och')S.out.ch=t.value;else S.out.variant=t.value;render()}
  else if(t.id==='stdays'){S.st.days=isNaN(+t.value)?t.value:+t.value;render()}

document.addEventListener('input',e=>{

/* ================= démarrage ================= */
async function start(){
  try{
    await loadAll();
    if(!S.settings||!Object.keys(S.settings).length){/* réglages par défaut en mémoire, écrits à la première sauvegarde */}
    ['prospects','calls','clients','settings','content'].forEach(c=>DB.watch(c,refresh));
  }catch(e){S.err=String(e.message||e);S.loaded=true}
  S.chal=true;
  render();
}
(async function boot(){
  const cfg=window.AOS_CONFIG||{};
  if(cfg.url&&cfg.key){
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';s.onload=res;s.onerror=()=>rej(new Error('Supabase indisponible'));document.head.appendChild(s)}).catch(e=>{S.err=e.message});
    if(window.supabase){const sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});DB=cloudBackend(sb);
      const {data}=await sb.auth.getSession();S.user=data.session?data.session.user:null;if(!S.user){render();return}}
    else DB=localBackend();
  }else DB=localBackend();
  await start();
})();
