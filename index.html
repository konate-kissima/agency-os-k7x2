function localBackend(){
  const mem={},subs={};
  const read=c=>{try{const s=localStorage.getItem('aos:'+c);return s?JSON.parse(s):(mem[c]||{})}catch(e){return mem[c]||{}}};
  const write=(c,o)=>{mem[c]=o;try{localStorage.setItem('aos:'+c,JSON.stringify(o))}catch(e){}(subs[c]||[]).forEach(f=>f())};
  return{mode:'local',
    async list(c){return Object.entries(read(c)).map(([id,d])=>({id,...d}))},
    async set(c,id,d){const o=read(c);o[id]=d;write(c,o)},
    async update(c,id,p){const o=read(c);o[id]={...(o[id]||{}),...p};write(c,o)},
    async del(c,id){const o=read(c);delete o[id];write(c,o)},
    async setMany(c,items){const o=read(c);items.forEach(([id,d])=>{o[id]=d});write(c,o)},
    watch(c,f){(subs[c]=subs[c]||[]).push(f)}};
}
function cloudBackend(sb){
  return{mode:'cloud',sb,
    async list(c){let out=[],from=0;for(;;){const{data,error}=await sb.from(c).select('id,data').range(from,from+999);if(error)throw error;out=out.concat(data.map(r=>({id:r.id,...r.data})));if(data.length<1000)break;from+=1000}return out},
    async set(c,id,d){const{error}=await sb.from(c).upsert({id,data:d});if(error)throw error},
    async update(c,id,p){const{error}=await sb.rpc('fusion_doc',{t:c,doc_id:id,patch:p});if(error)throw error},
    async del(c,id){const{error}=await sb.from(c).delete().eq('id',id);if(error)throw error},
    async setMany(c,items){for(let i=0;i<items.length;i+=400){const{error}=await sb.from(c).upsert(items.slice(i,i+400).map(([id,d])=>({id,data:d})));if(error)throw error}},
    watch(c,f){sb.channel('rt-'+c).on('postgres_changes',{event:'*',schema:'public',table:c},f).subscribe()}};
}

async function callResult(r){
  const p=byId(S.call.pid);if(!p)return;
  const sc=settings();
  const V=(id,k,d)=>{const e=$('#'+id);return e?e.value:(S.call[k]||d||'')};
  const note=V('cn','note'),obj=V('co','obj','—'),audio=V('ca','audio'),informed=!!($('#ci')?$('#ci').checked:S.call.informed);
  const hasDate=!!V('cd','date'),date=V('cd','date')||workday(r==='ans'?3:2),ntime=V('ct','time','10:00')||'10:00',rdvAt=V('cr','rdvAt');
  const place=V('cl','place').trim(),link=V('cv','link').trim();
  const pts={besoin:V('pt1','pt1').trim(),objectif:V('pt2','pt2').trim(),sensible:V('pt3','pt3').trim()};
  if(r==='rap'&&!hasDate){toast('Choisis la date du rappel (champ « Rappel le »).');return}
  if(isRdvRes(r)&&!rdvAt){toast('Renseigne la date et l\'heure du RDV.');return}
  if(r==='rdvp'&&!place){toast('Indique le lieu du rendez-vous physique.');return}
  const now=new Date();
  const ty=r==='rdvt'?'tel':r==='rdvp'?'physique':'visio';
  const call={channel:'appel',prospectId:p.id,prospectName:p.name,t:now.toISOString(),hour:now.getHours(),result:r,angle:S.call.angle||sc.angle,obj:obj==='—'||r!=='no'?'':obj,note,audio,informed,dept:p.dept||'',joint:JOINT.includes(r),answered:ANSWERED.includes(r)};
  if(isRdvRes(r)){call.rdvType=ty;call.rdvAt=rdvAt}
  const id='c'+uid();
  const touches=(p.touches||0)+1;
  const base={touches,lastCall:call.t,lastResult:r,rdvType:'',notes:note?((p.notes?p.notes+'\n':'')+today()+' : '+note):(p.notes||'')};
  let patch;
  if(r==='rdv'||r==='rdvv'||r==='rdvp')patch={...base,stage:'rdv',rdvAt,rdvType:ty,rdvPlace:ty==='physique'?place:'',rdvLink:link,pts,nextDate:'',rdvShow:'',rem24:false,rem2:false};
  else if(r==='rdvt')patch={...base,stage:'contacte',rdvAt,rdvType:'tel',pts,nextDate:rdvAt.slice(0,10),rdvShow:''};
  else if(r==='rap'||r==='ans')patch={...base,stage:'contacte',nextDate:date};
  else if(r==='nr'||r==='rep'){const joined=callsOf(p.id).some(c=>c.joint);const ctries=callsOf(p.id).filter(c=>isCall(c)&&(!p.cycleStart||c.t>=p.cycleStart)).length+1;
    const slots=['m','d','s'].filter(x=>x!==slotOf(call.hour));
    if(ctries>=MAX_TRIES&&!joined){patch=(p.cycle||1)<2?{...base,stage:'contacte',nextDate:addDays(today(),30),slots:[],cycle:2,cycleStart:new Date(now.getTime()+1).toISOString()}:{...base,stage:'perdu',lostReason:'Injoignable (2 cycles de '+MAX_TRIES+' tentatives)'}}
    else patch={...base,stage:'contacte',nextDate:workday(r==='nr'?1:2),slots}}
  else if(r==='hu'){const hus=callsOf(p.id).filter(c=>c.result==='hu').length+1;patch=hus>=2?{...base,stage:'perdu',lostReason:'A raccroché au nez (2 fois)'}:{...base,stage:'contacte',nextDate:workday(3),slots:['m','d','s'].filter(x=>x!==slotOf(call.hour))}}
  else if(r==='no')patch={...base,stage:'perdu',lostReason:call.obj||'Pas intéressé'};
  else if(r==='bad')patch={...base,phone:'',badPhone:true};
  else patch={...base,stage:'stop',optout:true};
  patch.nextTime=r==='rdvt'?rdvAt.slice(11,16):(r==='rap'||r==='ans')?ntime:'';
  const ok=await guard(async()=>{await DB.set('calls',id,call);await DB.update('prospects',p.id,patch)});
  if(ok){S.calls.push({id,...call});Object.assign(p,patch);S.call.pid='';S.call.open='';S.call.q='';S.call.step='';if(r==='nr')S.lastNR=p.id;if(isRdvRes(r))S.lastRDV=p.id;
    const nth=touches===1?'1er appel':touches+'e appel',tr=callsOf(p.id).filter(c=>isCall(c)&&(!p.cycleStart||c.t>=p.cycleStart)).length;
    const nxt=isRdvRes(r)?'RDV '+RDV_T[ty]+' le '+fdate(rdvAt):patch.stage==='perdu'?'fiche classée perdue':patch.stage==='stop'?'ne plus appeler':patch.nextDate?'prochain essai le '+fdate(patch.nextDate):'';
    S.lastRes=`<b>${esc(p.name)}</b> : ${esc(RES_L[r])} · ${nth}${(r==='nr'||r==='rep')&&!callsOf(p.id).some(c=>c.joint)?' ('+tr+'/'+MAX_TRIES+' dans cette série)':''}${nxt?' · '+nxt:''}`;
    toast(RES_L[r]+' enregistré · '+nth+(nxt?' · '+nxt:''));render();alarmCheck()}
}

const EFF_L={'00':'0 salarié','01':'1-2 salariés','02':'3-5 salariés','03':'6-9 salariés','11':'10-19 salariés','12':'20-49 salariés','21':'50-99 salariés','22':'100-199 salariés'};
const NAF_L={'43.22A':'Plomberie / eau / gaz','43.22B':'Chauffage / climatisation','43.21A':'Électricité','43.29A':'Isolation','43.29B':'Travaux d\'installation','33.12Z':'Maintenance d\'équipements','43.99C':'Maçonnerie / gros œuvre','47.52B':'Commerce de quincaillerie'};
function sectorOf(p){
  if(p.naf)return NAF_L[p.naf]||('NAF '+p.naf);
  const n=p.name||'';
  if(/chauff|chaudi|thermi|pompe|poêle|poele|énergie|energie/i.test(n))return 'Chauffage / énergie';
  if(/clim|froid|frigo/i.test(n))return 'Climatisation / froid';
  if(/plomb|sanitaire|salle de bain|fuite|canalis|dépann|depann/i.test(n))return 'Plomberie / dépannage';
  if(/élec|elec/i.test(n))return 'Électricité';
  return 'Non précisé';
}
function ageYears(p){const y=p.created_co?+String(p.created_co).slice(0,4):0;return y?new Date().getFullYear()-y:null}
function ageBucket(p){const a=ageYears(p);return a===null?'Année inconnue':a<2?'Moins de 2 ans':a<5?'2 à 5 ans':a<10?'5 à 10 ans':a<20?'10 à 20 ans':'20 ans et plus'}
function reviewBucket(p){const r=+p.reviews||0;return r===0?'Aucun avis':r<10?'1 à 9 avis':r<50?'10 à 49 avis':r<200?'50 à 199 avis':'200 avis et plus'}
const rdvFill=t=>String(t||'').replace(/\{prix_pilote\}/g,settings().pilotPrice);
function companyLine(p){
  const a=ageYears(p),parts=[];
  if(a!==null)parts.push(`<b>créée en ${esc(String(p.created_co).slice(0,4))}</b> (${a<1?'moins d\'un an':a+' an'+(a>1?'s':'')})`);
  parts.push(esc(sectorOf(p)));

  return `<div class="sm" style="margin-top:2px">${parts.join(' · ')}${a===null?` <span class="muted">· année de création pas encore trouvée</span>`:''}</div>`;

function hookFor(p){
  const n=p.name||'votre entreprise',v=p.city||'votre secteur';
  const yr=p.created_co?+String(p.created_co).slice(0,4):0;
  if(yr&&yr>=new Date().getFullYear()-2)return `j'ai vu que ${n} a été créée en ${yr}, vous lancez votre activité sur ${v}`;
  if(+p.reviews>=30&&+p.rating>=4.5)return `j'ai vu que ${n} a ${p.reviews} avis à ${p.rating}/5 sur Google, c'est un vrai bouche-à-oreille`;
  if(/chauffage|chaudi|pompe|thermi|énergie|energie/i.test(n))return `j'ai vu que ${n} fait du chauffage sur ${v}`;
  if(/dépann|depann|urgence|sos|express/i.test(n))return `j'ai vu que ${n} fait du dépannage sur ${v}`;
  if(/sanitaire|salle de bain|plomb/i.test(n)&&!p.website)return `je n'ai pas trouvé de site pour ${n}, les clients qui cherchent sur Google ne vous trouvent pas facilement`;
  if(p.instagram)return `j'ai vu votre compte Instagram, ${n} montre de vrais chantiers`;
  if(!p.website)return `je n'ai pas trouvé de site pour ${n} à ${v}`;
  return `je suis tombé sur ${n} à ${v}`;
}
function valueFor(p){
  // Un atout réel et vérifiable, jamais inventé ; vide s'il n'y en a pas
  const yr=p.created_co?+String(p.created_co).slice(0,4):0,y=new Date().getFullYear();
  if(yr&&yr<=y-10)return ` Une entreprise présente depuis ${yr}, ça force le respect.`;
  if(+p.reviews>=10&&+p.reviews<30&&+p.rating>=4.7)return ` Vos clients vous notent ${String(p.rating).replace('.',',')}/5 sur Google, c'est un vrai atout.`;
  return '';
}
function socialUrl(h,kind){h=String(h||'').trim();if(!h)return '';if(/^https?:/i.test(h))return h;h=h.replace(/^@/,'');return (kind==='facebook'?'https://facebook.com/':'https://instagram.com/')+h}
const fdateFull=iso=>{if(!iso)return '';const d=new Date(iso.length>10?iso:iso+'T12:00:00');return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})+(iso.length>10?' '+pad(d.getHours())+'h'+pad(d.getMinutes()):'')};
function adLibUrl(p){return 'https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=FR&media_type=all&search_type=keyword_unordered&q='+encodeURIComponent(p.name||'')}
function adsBlock(p){const v=p.adsMeta||'';
  const lab=v==='oui'?'Pub Meta : vue le '+fdate(p.adsMetaAt):v==='non'?'Pub Meta : aucune vue le '+fdate(p.adsMetaAt):'Pub Meta potentielle';
  return `<span class="adsb"><a href="${esc(adLibUrl(p))}" target="_blank" rel="noopener" title="Ouvre la Bibliothèque publicitaire de Meta cherchée sur ce nom : tu vérifies toi-même, rien d'automatique">${esc(lab)} ↗</a> <select id="adsm" data-id="${esc(p.id)}" aria-label="Résultat de ta vérification des pubs Meta"><option value=""${v===''?' selected':''}>à vérifier</option><option value="oui"${v==='oui'?' selected':''}>fait de la pub</option><option value="non"${v==='non'?' selected':''}>pas de pub</option></select></span>`}
function socialLinksHTML(p){return (p.instagram?`<a href="${esc(socialUrl(p.instagram))}" target="_blank" rel="noopener">Instagram</a> · `:'')+(p.facebook?`<a href="${esc(socialUrl(p.facebook,'facebook'))}" target="_blank" rel="noopener">Facebook</a> · `:'')}
function fillOut(txt,p){return fillScript(txt,p).replace(/\{nom_court\}/g,(p.name||'').split(/\s+/).slice(0,2).join(' '))}

async function outResult(r){
  const p=byId(S.out.pid);if(!p)return;
  const note=($('#on')||{}).value||'',handle=($('#oh')||{}).value.trim?$('#oh').value.trim():'',rdvAt=($('#or')||{}).value||'';
  if(r==='rdv'&&!rdvAt){toast('Renseigne la date et l\'heure du RDV.');return}
  const sc=settings();const now=new Date();const ch=S.out.ch;
  const call={channel:ch,prospectId:p.id,prospectName:p.name,t:now.toISOString(),hour:now.getHours(),result:r,angle:S.out.variant,obj:'',note,audio:ch==='video'?handle:'',informed:false,dept:p.dept||'',joint:OUT_JOINT.includes(r)};
  const id='c'+uid();
  const hk=ch==='dm_fb'?'facebook':ch==='dm_lin'?'linkedin':ch==='email'?'email':ch==='video'?'':'instagram';
  const base={touches:(p.touches||0)+1,lastCall:call.t,notes:note?((p.notes?p.notes+'\n':'')+today()+' : '+note):(p.notes||'')};
  if(hk&&handle)base[hk]=handle;
  let patch;
  if(r==='sent'){const tries=outTries(p)+1;patch={...base,stage:p.stage==='a_contacter'?'contacte':p.stage,outNext:workday(3)};if(tries>=MAX_OUT)patch.outDone=true;
    if(p.stage==='a_contacter')patch.nextDate=workday(2)}
  else if(r==='reply')patch={...base,stage:'contacte',nextDate:today(),nextTime:'',outNext:workday(7)};
  else if(r==='rdv')patch={...base,stage:'rdv',rdvAt,nextDate:''};
  else if(r==='no')patch={...base,stage:'perdu',lostReason:'Pas intéressé ('+CH_L[ch]+')'};
  else patch={...base,stage:'stop',optout:true};
  const ok=await guard(async()=>{await DB.set('calls',id,call);await DB.update('prospects',p.id,patch)});
  if(ok){S.calls.push({id,...call});Object.assign(p,patch);S.out.pid='';if(r==='rdv')S.lastRDV=p.id;toast(ALL_RES_L[r]+' enregistré.');render()}
}

function pipelineHTML(){
  const f=S.pf;let L=S.prospects;
  if(f.q){const q=f.q.toLowerCase();L=L.filter(p=>[p.name,p.city,p.phone].join(' ').toLowerCase().includes(q))}
  if(f.dept)L=L.filter(p=>deptOf(p)===f.dept);
  const depts=[...new Set(S.prospects.map(deptOf).filter(Boolean))].sort();
  const bar=`<div class="row" style="margin-bottom:12px"><input type="search" id="pq" placeholder="Rechercher (nom, ville, téléphone)" value="${esc(f.q)}"><select id="pdept"><option value="">Tous départements</option>${depts.map(d=>`<option${f.dept===d?' selected':''}>${esc(d)}</option>`).join('')}</select><button class="btn sm" data-act="newp">+ Ajouter une fiche</button></div>`;
  const cols=STAGES.map(([k,l])=>{const items=L.filter(p=>(p.stage||'a_contacter')===k);
    const shown=items.slice(0,25);
    return `<section class="card"><h3>${l} <span class="muted">(${items.length})</span></h3>${shown.length?shown.map(p=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span><b>${esc(p.name)}</b> <span class="muted sm">${esc(p.city||'')}${p.rdvAt&&k==='rdv'?' · RDV '+fdate(p.rdvAt):''}${p.nextDate&&k==='contacte'?' · rappel '+fdate(p.nextDate):''}${p.lostReason&&k==='perdu'?' · '+esc(p.lostReason):''}</span></span><button class="btn sm" data-act="open" data-id="${esc(p.id)}">Ouvrir</button></div>`).join(''):'<p class="muted sm">Aucune fiche.</p>'}${items.length>shown.length?`<p class="muted sm">+ ${items.length-shown.length} autres (utilise la recherche).</p>`:''}</section>`}).join('');

const fdt=t=>{const d=new Date(t);return isNaN(d)?String(t||''):d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})+' '+pad(d.getHours())+'h'+pad(d.getMinutes())};
const LOG_L={rdv:'RDV',msg:'Message',fathom:'Fathom',note:'Note'};
function timeline(p){
  const ev=callsOf(p.id).map(c=>({t:c.t,k:CH_L[c.channel||'appel'],r:ALL_RES_L[c.result]||c.result,x:[c.obj,c.note].filter(Boolean).join(' — '),a:c.audio}));
  (p.log||[]).forEach(l=>ev.push({t:l.t,k:LOG_L[l.k]||l.k,r:'',x:l.txt||'',u:l.url}));
  return ev.sort((a,b)=>String(b.t).localeCompare(String(a.t)));
}
function timelineHTML(p,max){
  const ev=timeline(p).slice(0,max||200);if(!ev.length)return '<p class="muted sm">Aucune action pour l\'instant.</p>';
  return `<div class="sm tl">${ev.map(e=>`<div style="border-top:1px solid var(--line);padding:5px 0"><b>${esc(fdt(e.t))}</b> · ${esc(e.k)}${e.r?' · '+esc(e.r):''}${e.x?`<div class="muted" style="white-space:pre-wrap">${esc(e.x)}</div>`:''}${e.u?`<a href="${esc(e.u)}" target="_blank" rel="noopener">Ouvrir</a>`:''}${e.a?` <a href="${esc(e.a)}" target="_blank" rel="noopener">audio</a>`:''}</div>`).join('')}</div>`}

/* ================= records : la référence à battre ================= */
function weekStart(d){const x=new Date(d+'T12:00:00');return addDays(d,-((x.getDay()+6)%7))}
const REC_M=[['n','Appels'],['j','Conversations'],['r','RDV'],['dm','Messages (DM, mail)'],['v','Vidéos'],['ct','Contenus']];
function periodAgg(){
  const A={D:{},W:{},M:{}};
  const add=(d,f)=>[['D',d],['W',weekStart(d)],['M',d.slice(0,7)]].forEach(([p,k])=>{const x=A[p][k]=A[p][k]||{n:0,j:0,r:0,dm:0,v:0,ct:0};x[f]++});
  S.calls.forEach(c=>{const d=String(c.t).slice(0,10);if(isCall(c)){add(d,'n');if(isAns(c))add(d,'j')}else if(c.result==='sent')add(d,c.channel==='video'?'v':'dm');if(isRdvRes(c.result))add(d,'r')});
  S.content.forEach(c=>{if(c.d)add(String(c.d).slice(0,10),'ct')});
  return A;
}
function recInfo(A,p,f){
  const t=today(),ck=p==='D'?t:p==='W'?weekStart(t):t.slice(0,7);
  const cur=(A[p][ck]||{})[f]||0;
  let best=0,bk='';Object.entries(A[p]).forEach(([k,v])=>{if(k!==ck&&(v[f]||0)>best){best=v[f];bk=k}});
  const isRec=cur>0&&cur>best;
  const end=!bk?'':p==='D'?bk:p==='W'?addDays(bk,6):toISO(new Date(+bk.slice(0,4),+bk.slice(5,7),0,12));
  const since=end?Math.max(0,Math.round((new Date(t+'T12:00:00')-new Date(end+'T12:00:00'))/864e5)):0;
  return {cur,best,bk,isRec,since};
}
const sinceTxt=n=>n===0?'égalé aujourd\'hui':n===1?'depuis hier':'il y a '+n+' jours';
function recordsHTML(){
  const A=periodAgg();
  const lbl=(p,k)=>p==='D'?fdate(k):p==='W'?'sem. du '+fdate(k):new Date(k+'-15T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
  const cell=(p,f)=>{const r=recInfo(A,p,f);return `<td class="r"><b>${r.cur}</b> <span class="muted sm">/ ${Math.max(r.best,r.cur)}</span><div class="sm ${r.isRec?'':'muted'}">${r.isRec?'🏆 record battu':r.best?'record '+sinceTxt(r.since)+' · '+esc(lbl(p,r.bk)):'—'}</div></td>`};
  const rows=REC_M.map(([f,l])=>`<tr><td><b>${l}</b></td>${cell('D',f)}${cell('W',f)}${cell('M',f)}</tr>`).join('');
  return `<section class="card"><h3>Tes records à battre</h3><div class="scroll-x"><table class="t"><thead><tr><th></th><th class="r">Jour</th><th class="r">Semaine</th><th class="r">Mois</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted sm">En gras : ton score en cours. Après « / » : ton meilleur score. Dessous : depuis combien de temps tu ne l'as pas battu. Semaine = du lundi au dimanche.</p></section>`;
}
const EGO=[
  (r,y)=>`Le record est à ${r}. Hier : ${y}. Tu t'en contentes ?`,
  r=>`Personne ne va faire ces appels à ta place. Vise ${r+1}.`,
  r=>`Un record qui dure, c'est une limite que tu t'es fixée toi-même. ${r+1} aujourd'hui.`,
  r=>`Les autres s'arrêtent à ${Math.round(r*.6)}. Toi, tu fais ${r+1}.`,
  (r,y)=>y<r?`Hier tu as fait ${y}. Aujourd'hui tu fais mieux, point.`:`Tu as déjà prouvé que tu peux. Fais-le encore.`,
  r=>`Ton futur toi te remercie de ${r+1} appels.`,
  r=>`${r+1}. Pas ${r}. Le record, on le dépasse.`
];
function challengeHTML(){
  const A=periodAgg(),t=today(),y=(A.D[addDays(t,-1)]||{}).n||0;
  const d=recInfo(A,'D','n'),w=recInfo(A,'W','n'),m=recInfo(A,'M','n');
  const seed=Math.floor(new Date()/864e5);
  const first=!d.best&&!d.cur;
  const head=first?`<p style="font-size:1.1em">Aucun record pour l'instant. Aujourd'hui, tu poses la première référence. Fais-la grande.</p>`
    :`<p style="font-size:1.1em">Record d'appels sur une journée : <b style="font-size:1.6em">${Math.max(d.best,d.cur)}</b>${d.isRec?'':` (${fdate(d.bk)})`}</p><p>${d.isRec?'🏆 Tu l\'as battu aujourd\'hui. Repousse-le.':'Tu ne l\'as pas battu '+sinceTxt(d.since)+'.'} <b>Aujourd'hui : ${d.cur}</b>.</p>`;
  const line=(l,r)=>r.best||r.cur?`<div class="row" style="justify-content:space-between"><span>${l}</span><span><b>${r.cur}</b> / ${Math.max(r.best,r.cur)} · ${r.isRec?'🏆 record battu':sinceTxt(r.since)}</span></div>`:'';

function parseCSV(text){
  const rows=[];let row=[],cur='',q=false;text=text.replace(/^﻿/,'');
  const delim=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;else if(c===delim){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x!==''))rows.push(row);row=[]}else cur+=c}
  row.push(cur);if(row.some(x=>x!==''))rows.push(row);return rows;
}
const HMAP={name:['name','nom','entreprise','displayname'],phone:['phone','telephone','téléphone','tel'],website:['website','site','url'],rating:['rating','note'],reviews:['reviews','avis','userratingcount'],address:['address','adresse'],city:['city','ville'],dept:['dept','departement','département'],placeId:['place_id','placeid','id'],mapsUrl:['maps_url','mapsurl','googlemapsuri'],score:['score'],email:['email','mail']};

function mergeNew(items,have,phones,mk){/* utilitaire de dédoublonnage */}
const dupKeys=p=>{const k=[];const ph=normPhone(p.phone);if(ph)k.push('t'+ph);if(p.siren)k.push('s'+p.siren);if(p.name&&p.city)k.push('n'+String(p.name).toLowerCase().replace(/[^a-z0-9]/g,'')+'|'+String(p.city).toLowerCase())+'';return k};
const isDup=p=>p.stage==='perdu'&&p.lostReason==='Doublon';
async function addProspects(items){
  if(!items.length)return 0;
  const idx=new Map();S.prospects.forEach(p=>{if(!isDup(p))dupKeys(p).forEach(k=>{if(!idx.has(k))idx.set(k,p)})});
  const fresh=[];let merged=0;
  for(const it of items){
    const d=it[1];const keys=dupKeys(d);const hit=keys.map(k=>idx.get(k)).find(Boolean);
    if(hit){
      if(hit.enrich==='todo'&&!hasPhone(hit.phone)&&hasPhone(d.phone)){
        const patch={phone:d.phone,email:d.email||hit.email||'',website:d.website||hit.website||'',address:d.address||hit.address,enrich:'done',score:Math.max(hit.score||0,d.score||0)};
        if(await guard(()=>DB.update('prospects',hit.id,patch))){Object.assign(hit,patch);keys.forEach(k=>idx.set(k,hit));merged++}
      }
      continue;
    }
    keys.forEach(k=>idx.set(k,{id:it[0]}));fresh.push(it);
  }
  let n=0;
  if(fresh.length&&await guard(()=>DB.setMany('prospects',fresh))){fresh.forEach(([id,d])=>S.prospects.push({id,...d}));n=fresh.length}
  return n+merged;
}
async function cleanDupes(){

  for(const p of list){
    const keys=dupKeys(p);const hit=keys.map(k=>seen.get(k)).find(Boolean);
    if(hit){const patch={stage:'perdu',lostReason:'Doublon',optout:p.optout||false};if(await guard(()=>DB.update('prospects',p.id,patch))){Object.assign(p,patch);n++}}
    else keys.forEach(k=>seen.set(k,p));
  }

}

  else if(a==='np-save')addProspect();
  else if(a==='mkclient')makeClient(b.dataset.id);
  else if(a==='cli-open'){$('#dlg').open&&$('#dlg').close();S.tab='clients';S.cl.open=b.dataset.id;render()}
  else if(a==='cli-close'){S.cl.open='';render()}
  else if(a==='cli-save')saveClient(b.dataset.id);
  else if(a==='met-add')addMetric(b.dataset.id);
  else if(a==='set-save')saveSettings();
  else if(a==='addangle')addAngle();
  else if(a==='demo')loadDemo();
  else if(a==='goals-save')saveGoals();
  else if(a==='dedupe')cleanDupes();
  else if(a==='rdvdone'){const pp=S.lastRDV&&byId(S.lastRDV);if(pp)logEv(pp,'msg','Confirmation du RDV préparée');S.lastRDV='';render()}
  else if(a==='nrdone'){const p=byId(S.lastNR);if(p&&b.tagName==='A'){DB.update('prospects',p.id,{nrSent:(p.nrSent||0)+1});p.nrSent=(p.nrSent||0)+1}S.lastNR='';setTimeout(render,50)}
  else if(a==='osm')sourceOSM();
  else if(a==='gouv')sourceGouv();
  else if(a==='rge')sourceRGE();
  else if(a==='exp-calls')exportCalls();
  else if(a==='exp-pros')exportProspects();
  else if(a==='logout'){await DB.sb.auth.signOut();S.user=null;render()}
  else if(a==='login'){const {data,error}=await DB.sb.auth.signInWithPassword({email:$('#lgm').value.trim(),password:$('#lgp').value});if(error){$('#lge').textContent='Connexion impossible : '+error.message;return}S.user=data.user;await start()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='adsm'){const t=e.target,p=byId(t.dataset.id);if(p){const v=t.value,at=v?new Date().toISOString():'';p.adsMeta=v;p.adsMetaAt=at;DB.update('prospects',p.id,{adsMeta:v,adsMetaAt:at}).then(()=>toast('Vérification enregistrée.')).catch(()=>toast('Enregistrement impossible, réessaie.'));const a=t.parentNode.querySelector('a');if(a)a.textContent=(v==='oui'?'Pub Meta : vue le '+fdate(at):v==='non'?'Pub Meta : aucune vue le '+fdate(at):'Pub Meta potentielle')+' ↗'}return}
  const t=e.target;
  if(t.id==='ci'){S.call.informed=t.checked;return}
  if(t.id==='recf'){const f=t.files[0];if(f)recSend(f,f.name);return}
  if(t.id==='co'){S.call.obj=t.value;return}
  if(t.id==='cang'){S.call.angle=t.value;const keep={note:$('#cn')?$('#cn').value:'',obj:$('#co')?$('#co').value:'—',audio:$('#ca')?$('#ca').value:'',informed:$('#ci')?$('#ci').checked:false};Object.assign(S.call,keep);render()}
  else if(t.dataset&&t.dataset.act==='mobsel'){S.call.mob=t.value;S.call.pid='';render()}
  else if(t.id==='och'||t.id==='ovar'){S.out.note=$('#on')?$('#on').value:S.out.note;S.out.handle='';if(t.id==='och')S.out.ch=t.value;else S.out.variant=t.value;render()}
  else if(t.id==='stdays'){S.st.days=isNaN(+t.value)?t.value:+t.value;render()}
  else if(t.id==='stfrom'||t.id==='stto'){S.st[t.id==='stfrom'?'from':'to']=t.value;render()}
  else if(t.id==='pdept'){S.pf.dept=t.value;render()}
  else if(t.dataset&&t.dataset.act==='tchk')toggleDaily(t.dataset.k,t.checked);
  else if(t.dataset&&t.dataset.act==='chk')toggleCheck(t.dataset.id,t.dataset.k,t.checked);
  else if(t.id==='csvf'&&t.files[0]){const r=new FileReader();r.onload=()=>importCSV(String(r.result));r.readAsText(t.files[0])}
});
document.addEventListener('input',e=>{
  const t=e.target;
  const SCK={cl:'place',cv:'link',pt1:'pt1',pt2:'pt2',pt3:'pt3',cd:'date',ct:'time',cr:'rdvAt',co:'obj'};
  if(SCK[t.id]){S.call[SCK[t.id]]=t.value;return}
  if(t.id==='cn')S.call.note=t.value;else if(t.id==='ca')S.call.audio=t.value;else if(t.id==='on')S.out.note=t.value;else if(t.id==='oh')S.out.handle=t.value;
  else if(t.id==='pq'){S.pf.q=t.value;render()}
  else if(t.id==='cq'){S.call.q=t.value;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lgp'){$('[data-act=login]').click()}});

/* ================= démarrage ================= */
async function start(){
  try{
    await loadAll();
    if(!S.settings||!Object.keys(S.settings).length){/* réglages par défaut en mémoire, écrits à la première sauvegarde */}
    ['prospects','calls','clients','settings','content'].forEach(c=>DB.watch(c,refresh));
  }catch(e){S.err=String(e.message||e);S.loaded=true}
  S.chal=true;
  render();
}
(async function boot(){
  const cfg=window.AOS_CONFIG||{};
  if(cfg.url&&cfg.key){
    await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';s.onload=res;s.onerror=()=>rej(new Error('Supabase indisponible'));document.head.appendChild(s)}).catch(e=>{S.err=e.message});
    if(window.supabase){const sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true}});DB=cloudBackend(sb);window.__sb=sb;
      const {data}=await sb.auth.getSession();S.user=data.session?data.session.user:null;if(!S.user){render();return}}
    else DB=localBackend();
  }else DB=localBackend();
  await start();alarmCheck();
})();
</script></body></html>
