<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tournée Île-de-France</title>
<meta name="theme-color" content="#55612a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Idée : un écran de terrain, une société à la fois, tout le reste est replié. */
:root{--bg:#f3f1e8;--card:#fffdf6;--ink:#22260f;--mute:#6a6e56;--kaki:#55612a;--kaki2:#3f4a1d;--or:#c8932b;--line:#dad6c2;--ok:#2f7d3a;--warn:#b4561b;--bad:#a63a2e;--chip:#ebe8d6;--display:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Source Sans 3',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a0c;--card:#20240f;--ink:#efecd9;--mute:#a4a88c;--kaki:#8a9a49;--kaki2:#6e7d35;--or:#e0aa44;--line:#363b1f;--ok:#6fbf7a;--warn:#e08d4c;--bad:#e2776b;--chip:#2b3015;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171a0c;--card:#20240f;--ink:#efecd9;--mute:#a4a88c;--kaki:#8a9a49;--kaki2:#6e7d35;--or:#e0aa44;--line:#363b1f;--ok:#6fbf7a;--warn:#e08d4c;--bad:#e2776b;--chip:#2b3015;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);padding:0 0 40px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px}
h1{font:700 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:6px 0 2px;text-wrap:balance}
h2{font:700 22px/1.1 var(--display);letter-spacing:.02em;margin:0 0 6px}
.sub{color:var(--mute);font-size:14px;margin:0 0 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.prog{height:8px;border-radius:6px;background:var(--chip);overflow:hidden;flex:1;min-width:120px}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--kaki),var(--or))}
button,.btn{font:600 16px var(--body);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;min-height:46px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
a{color:var(--kaki2)}button:focus-visible,.btn:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--or);outline-offset:2px}
.pri{background:var(--kaki);border-color:var(--kaki2);color:#fff}.btn.gold,.gold{background:var(--or);border-color:var(--or);color:#22260f}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}.seg button{border:0;border-radius:0;background:transparent}.seg button[aria-pressed="true"]{background:var(--kaki);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.card.cur{border:2px solid var(--kaki)}.lab{font:700 13px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--kaki)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.chip{background:var(--chip);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.open{color:var(--ok)}.closed{color:var(--bad)}.vis-1{background:var(--ok);color:#fff}.vis-2{background:var(--or);color:#22260f}.vis-3{background:var(--chip)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.res button{min-height:54px}
.res .full{grid-column:1/-1}
textarea{width:100%;font:16px var(--body);border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);min-height:56px;margin-top:8px}
details{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}summary{font-weight:700;cursor:pointer;min-height:36px;display:flex;align-items:center}
.say{background:var(--chip);border-radius:10px;padding:8px 10px;margin:6px 0}.say b{display:block;font:700 12px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--kaki)}
.mute{color:var(--mute);font-size:14px}ul.l{margin:6px 0;padding-left:18px}ul.l li{margin:2px 0}
.list{display:flex;flex-direction:column;gap:6px}.li{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}
.tag{font-weight:700}.t-rdv{color:var(--ok)}.t-refus{color:var(--bad)}.t-rappel{color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
.hero{display:flex;flex-direction:column;gap:8px;margin:10px 0}.hero .btn,.hero button.big{min-height:60px;font-size:18px}
.inp{display:flex;gap:6px}.inp input{flex:1;min-width:0;font:16px var(--body);border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink)}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.cats button{min-height:38px;padding:6px 12px;border-radius:999px;font-size:14px}.cats button[aria-pressed="true"]{background:var(--kaki);color:#fff;border-color:var(--kaki2)}
.err{color:var(--bad);font-weight:600}.dir{background:var(--chip);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
</style></head><body><div class="wrap" id="app"></div>
<script>
const KEY='tournee-idf-v1';
const RES={rdv:['RDV pris','t-rdv'],rappel:['À rappeler / repasser','t-rappel'],carte:['Carte laissée',''],refus:['Pas intéressé','t-refus'],absent:['Patron absent',''],passe:['Passé (fermé)','']};
const CAT={garage:'Garage / carrosserie',vente:'Vente de véhicules',agence:'Agence immobilière',opticien:'Opticien',autoecole:'Auto-école',beaute:'Institut / spa',coiffure:'Coiffure / ongles'};
const WHAT={garage:'des clients qui demandent un devis ou un rendez-vous d\'entretien',vente:'des acheteurs qui demandent un essai ou une reprise',agence:'des propriétaires qui demandent une estimation',opticien:'des rendez-vous d\'examen de vue',autoecole:'des inscriptions de nouveaux élèves',beaute:'des réservations de soins',coiffure:'de nouveaux clients qui réservent'};
const WEIGHT={garage:1,vente:1,agence:1,opticien:1,autoecole:1,beaute:1.3,coiffure:2};
const CHAIN=/\b(krys|optic ?2000|afflelou|atol|generale d.?optique|grand optical|alain mikli|optical center|century ?21|orpi|laforet|guy hoquet|foncia|nexity|plaza|square habitat|era immobilier|citya|oralia|norauto|speedy|midas|feu vert|euromaster|point s|vulco|carglass|renault|peugeot|citroen|dacia|toyota|volkswagen|audi|bmw|mercedes|ford|opel|fiat|nissan|hyundai|kia|seat|skoda|tesla|jean louis david|franck provost|dessange|camille albane|saint algue|tchip|fabio salsa|coiff ?& ?co|intermede|yves rocher|sephora|nocibe|marionnaud|body ?minute|guerlain|l.?occitane|ecf|code rousseau|ornikar|cer|permis express|dekra|autosur|securitest)\b/;
const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const ENDPOINTS=['https://overpass.openstreetmap.fr/api/interpreter','https://overpass-api.de/api/interpreter'];
let st={stops:[],res:{},dirs:{},pos:null,posLabel:'',mode:'walk',radius:'auto',cats:{garage:1,vente:1,agence:1,opticien:1,autoecole:1,beaute:1,coiffure:0},cur:null,note:'',busy:'',err:'',found:0,r:0};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x)Object.assign(st,x,{busy:'',err:''})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(Object.assign({},st,{busy:'',err:''})))}catch(e){}};
const $=s=>document.querySelector(s),esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function now(){const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Paris',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const g=t=>f.find(p=>p.type===t).value;return{d:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(g('weekday')),m:(+g('hour')%24)*60+ +g('minute')}}
const hh=m=>String(Math.floor(m/60)).padStart(2,'0')+'h'+String(m%60).padStart(2,'0');
const DN={mo:0,tu:1,we:2,th:3,fr:4,sa:5,su:6};
function parseOH(s){if(!s)return null;s=String(s).trim();if(s==='24/7')return[0,1,2,3,4,5,6].map(()=>[[0,1440]]);
 const h=[[],[],[],[],[],[],[]];const DY='(?:mo|tu|we|th|fr|sa|su)',RNG=DY+'(?:-'+DY+')?',TM='\\d{1,2}:\\d{2}-\\d{1,2}:\\d{2}';
 const re=new RegExp('^('+RNG+'(?:\\s*,\\s*'+RNG+')*)?\\s*(off|closed|'+TM+'(?:\\s*,\\s*'+TM+')*)$','i');
 for(let rule of s.split(';')){rule=rule.trim();const hadPH=/\bPH\b/i.test(rule);rule=rule.replace(/\bPH\b\s*,?\s*/gi,'').trim();if(!rule)continue;const m=rule.match(re);if(!m)return null;if(hadPH&&!m[1])continue;
  let days=[];if(m[1]){for(const part of m[1].split(',')){const [a,b]=part.trim().toLowerCase().split('-');let i=DN[a],j=b?DN[b]:i;for(let k=i;;k=(k+1)%7){days.push(k);if(k===j)break}}}else days=[0,1,2,3,4,5,6];
  const off=/^(off|closed)$/i.test(m[2]);const iv=off?[]:m[2].split(',').map(x=>{const [a,b]=x.trim().split('-');const p=t=>{const [H,M]=t.split(':');return +H*60+ +M};let A=p(a),B=p(b);if(B<=A)B=1440;return[A,B]});
  for(const d of days)h[d]=iv}
 return h}
function openInfo(s){if(!s.h)return{open:null,txt:'Horaires inconnus (vois Google Maps)'};const n=now(),iv=s.h[n.d]||[];for(const [a,b] of iv){if(n.m>=a&&n.m<b)return{open:true,txt:'Ouvert, ferme à '+hh(b)}}
 const nx=iv.find(([a])=>a>n.m);if(nx)return{open:false,txt:'Fermé, ouvre à '+hh(nx[0])};return{open:false,txt:'Fermé aujourd\'hui'}}
function dist(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng),q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
const eta=km=>st.mode==='walk'?Math.max(1,Math.round(km*1.3/4.8*60)):Math.max(2,Math.round(km*1.3/25*60)+2);
const fmtKm=km=>km<1?Math.round(km*1000/10)*10+' m':km.toFixed(1).replace('.',',')+' km';
const isParis=p=>dist(p,{lat:48.8534,lng:2.3488})<6.5;
function radiusFor(p){return st.radius==='auto'?(isParis(p)?500:1500):+st.radius}
function mapOf(t){const c=t.shop==='car_repair'?'garage':t.shop==='car'?'vente':(t.shop==='estate_agent'||t.office==='estate_agent')?'agence':t.shop==='optician'?'opticien':t.amenity==='driving_school'?'autoecole':(t.leisure==='spa'||t.shop==='massage'||t.shop==='beauty')?'beaute':t.shop==='hairdresser'?'coiffure':null;return c}
async function overpass(lat,lng,R){const a=`(around:${R},${lat},${lng})`;const q=`[out:json][timeout:25];(nwr${a}[shop~"^(car_repair|car|estate_agent|optician|hairdresser|beauty|massage)$"][name];nwr${a}[amenity=driving_school][name];nwr${a}[office=estate_agent][name];nwr${a}[leisure=spa][name];);out center tags 800;`;
 let last='';for(const ep of ENDPOINTS){try{const c=new AbortController(),to=setTimeout(()=>c.abort(),20000);const r=await fetch(ep+'?data='+encodeURIComponent(q),{signal:c.signal});clearTimeout(to);if(!r.ok){last='HTTP '+r.status;continue}const j=await r.json();return j.elements||[]}catch(e){last=String(e.name==='AbortError'?'délai dépassé':e.message||e)}}
 throw new Error(last||'serveur injoignable')}
function toStops(els,from){const seen=new Set(),out=[];for(const e of els){const t=e.tags||{};if(!t.name||t.brand||t['brand:wikidata'])continue;const nn=norm(t.name);if(CHAIN.test(nn)||/\b(tatou|tattoo|piercing|notaire|etude)\b/.test(nn))continue;let cat=mapOf(t);if(!cat)continue;if(cat==='beaute'&&/(nail|ongle)/.test(nn))cat='coiffure';const lat=e.lat??(e.center&&e.center.lat),lng=e.lon??(e.center&&e.center.lon);if(lat==null)continue;
  const k=norm(t.name)+lat.toFixed(3)+lng.toFixed(3);if(seen.has(k))continue;seen.add(k);const id=e.type+'/'+e.id;if(st.res[id])continue;
  const addr=[[t['addr:housenumber'],t['addr:street']].filter(Boolean).join(' '),[t['addr:postcode'],t['addr:city']].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  out.push({id,n:t.name,cat,lat,lng,addr,cp:t['addr:postcode']||'',tel:(t.phone||t['contact:phone']||'').split(';')[0].trim(),h:parseOH(t.opening_hours)})}
 return out}
async function search(lat,lng,label){const p={lat,lng};st.err='';st.busy='Recherche des commerces autour de toi…';render();
 try{const R=radiusFor(p),els=await overpass(lat,lng,R);const list=toStops(els,p);st.pos=p;st.posLabel=label;st.stops=list;st.cur=null;st.found=list.length;st.r=R;st.busy='';save()}catch(e){st.busy='';st.err='Recherche impossible : '+e.message+'. Réessaie dans un instant.'}
 render()}
function geo(){st.err='';if(!navigator.geolocation){st.err='Position indisponible sur cet appareil. Tape une adresse ci-dessous.';return render()}
 st.busy='Recherche de ta position…';render();navigator.geolocation.getCurrentPosition(p=>search(p.coords.latitude,p.coords.longitude,'ta position'),()=>{st.busy='';st.err='Position refusée ou indisponible. Ouvre cette page dans Safari, autorise la localisation, ou tape une adresse ci-dessous.';render()},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}
async function geoAddr(q){if(!q.trim())return;st.err='';st.busy='Recherche de l\'adresse…';render();try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=fr&viewbox=1.4,49.3,3.6,48.1&q='+encodeURIComponent(q));const j=await r.json();if(!j[0]){st.busy='';st.err='Adresse introuvable.';return render()}await search(+j[0].lat,+j[0].lon,q)}catch(e){st.busy='';st.err='Adresse : '+e.message;render()}}
const pool=()=>st.stops.filter(s=>!st.res[s.id]&&st.cats[s.cat]);
function pick(from,list){const sc=list.map(s=>({s,o:openInfo(s).open,v:dist(from,s)*(WEIGHT[s.cat]||1)}));const ok=sc.filter(x=>x.o!==false);const p=ok.length?ok:sc;p.sort((a,b)=>a.v-b.v);return p[0]?p[0].s:null}
function ensureCur(){if(st.cur&&!st.res[st.cur]){const c=st.stops.find(s=>s.id===st.cur);if(c&&st.cats[c.cat])return}const n=st.pos?pick(st.pos,pool()):null;st.cur=n?n.id:null;save()}
function pitch(s){const who=(st.dirs[s.id]&&st.dirs[s.id].pick)||'';const ask=who?`« Bonjour, je souhaite parler à ${esc(who)}, s'il est là. »`:'« Bonjour, je cherche le patron ou le gérant, il est là ? »';
 return `<div class="say"><b>1. Entrée (10 s)</b>${ask}<br>« Konaté Kissima, d'Instinct Agency, je suis du coin. Je ne vous prends que 30 secondes. »</div>
 <div class="say"><b>2. Accroche</b>« Je fais venir ${WHAT[s.cat]} par Facebook et Instagram, pour les commerces de la zone. Aujourd'hui, vos nouveaux clients viennent plutôt de Google ou du bouche-à-oreille ? »</div>
 <div class="say"><b>3. Offre en une phrase</b>« Je lance la pub, je gère les visuels et le suivi, vous recevez les demandes directement. C'est un programme pilote : la première partie vous est remboursée si l'objectif n'est pas atteint. Les chiffres, je vous les détaille au rendez-vous. »</div>
 <div class="say"><b>4. Demande</b>« Je peux vous montrer ça en 10 minutes : tout à l'heure en repassant, ou mardi 10 h / jeudi 14 h ? »</div>
 <div class="say"><b>Si le patron est absent</b>« Quand est-il là ? Je repasse à ce moment. Je vous laisse ma carte, qui puis-je citer ? » Note le nom et le créneau ci-dessous.</div>
 <details><summary>Réponses aux objections</summary><ul class="l"><li><b>Pas le temps</b> : « Justement, 10 minutes sur le créneau qui vous arrange, vous choisissez. »</li><li><b>J'ai déjà quelqu'un</b> : « Très bien. Est-ce qu'il s'engage sur un nombre de demandes ? Moi, la première partie est remboursée si l'objectif n'est pas atteint. »</li><li><b>Ça marche par le bouche-à-oreille</b> : « Parfait, on le garde. La pub sert à remplir les creux. »</li><li><b>Combien ça coûte ?</b> : « Ça dépend de votre zone et de votre objectif, on le chiffre ensemble en 10 minutes. »</li></ul></details>`}
const dirMode=m=>st.mode==='walk'?'walking':'driving';
const mapsUrl=s=>'https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'&travelmode='+dirMode();
const gUrl=s=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.n+' '+(s.addr||s.lat+','+s.lng));
function dirBox(s){const d=st.dirs[s.id];if(!d)return `<button data-a="dir" style="margin-top:8px">🔎 Trouver le dirigeant (registre officiel)</button>`;if(d==='busy')return '<p class="mute">Recherche…</p>';
 if(d.err)return `<p class="mute">${esc(d.err)}</p>`;if(!d.items.length)return '<p class="mute">Aucun dirigeant retrouvé : demande « le patron » sur place.</p>';
 return d.items.map((x,i)=>`<div class="dir"><b>${esc(x.nom)}</b><br><span class="mute">${esc(x.adr||'')}</span><br>${x.dir.length?x.dir.map((p,j)=>`<button data-a="pickdir" data-v="${esc(p.n)}" style="min-height:36px;padding:4px 10px;margin:4px 4px 0 0">${esc(p.l)}</button>`).join(''):'<span class="mute">Dirigeant non publié</span>'}</div>`).join('')+'<p class="mute">Un homonyme est possible : appuie sur un nom pour l\'utiliser dans le script, à confirmer sur place.</p>'}
async function findDir(s){st.dirs[s.id]='busy';render();try{let cp=s.cp;if(!cp){const r=await fetch('https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&lat='+s.lat+'&lon='+s.lng);const j=await r.json();cp=(j.address&&j.address.postcode)||''}
 const r=await fetch('https://recherche-entreprises.api.gouv.fr/search?q='+encodeURIComponent(s.n)+(cp?'&code_postal='+cp:'')+'&etat_administratif=A&per_page=3');const j=await r.json();
 st.dirs[s.id]={items:(j.results||[]).map(x=>({nom:String(x.nom_complet||'').replace(/\s*\(.*$/,''),adr:x.siege&&(x.siege.adresse||x.siege.geo_adresse),dir:(x.dirigeants||[]).filter(d=>d.nom).slice(0,2).map(d=>{const tc=t=>String(t).toLowerCase().replace(/(^|[\s'-])([a-zà-ÿ])/g,(m,x,y)=>x+y.toUpperCase());const n=tc(((d.prenoms||'').split(',')[0]+' '+d.nom).trim());return{n,l:n+(d.qualite?' ('+String(d.qualite).toLowerCase()+')':'')}})}))}}catch(e){st.dirs[s.id]={err:'Registre injoignable : '+e.message,items:[]}}
 save();render()}
function card(s,label,from,isCur){const o=openInfo(s),km=dist(from,s);
 return `<section class="card${isCur?' cur':''}"><div class="lab">${label}</div><h2>${esc(s.n)}</h2>
 <div class="chips"><span class="chip">${CAT[s.cat]}</span><span class="chip ${o.open===true?'open':o.open===false?'closed':''}">${o.txt}</span></div>
 <div>${s.addr?esc(s.addr):'<span class="mute">Adresse non renseignée, suis le GPS</span>'}</div><div class="mute">${s.tel?'<a href="tel:'+s.tel.replace(/[^+\d]/g,'')+'">'+esc(s.tel)+'</a> · ':''}<a href="${gUrl(s)}" target="_blank" rel="noopener">Avis et horaires sur Google Maps</a></div>
 <div class="row" style="margin-top:10px"><a class="btn gold" href="${mapsUrl(s)}" target="_blank" rel="noopener">${st.mode==='walk'?'🚶':'🚗'} Y aller · ${fmtKm(km)} · ${eta(km)} min</a></div>`}
function render(){ensureCur();const t=pool(),dn=Object.keys(st.res).length;const cur=st.stops.find(s=>s.id===st.cur);let h='';
 h+=`<h1>Tournée Île-de-France</h1><p class="sub">${st.pos?esc(st.found)+' commerces indépendants dans '+(st.r>=1000?st.r/1000+' km':st.r+' m')+' autour de '+esc(st.posLabel)+'. Le plus utile d\'abord, puis le plus proche.':'Appuie sur le bouton : la liste se construit autour de toi.'}</p>
 <div class="hero"><button class="pri big" data-a="geo"${st.busy?' disabled':''}>📍 Autour de moi</button>
 <form class="inp" data-a="addr"><input id="addr" type="text" placeholder="ou tape une adresse, un quartier, une ville" aria-label="Adresse" enterkeyhint="search"><button type="submit"${st.busy?' disabled':''}>Chercher</button></form></div>
 <div class="bar"><div class="seg" role="group" aria-label="Mode de déplacement"><button data-a="mode" data-v="walk" aria-pressed="${st.mode==='walk'}">🚶 À pied</button><button data-a="mode" data-v="car" aria-pressed="${st.mode==='car'}">🚗 Voiture</button></div>
 <div class="seg" role="group" aria-label="Rayon">${[['auto','Auto'],['500','500 m'],['1000','1 km'],['2000','2 km']].map(x=>`<button data-a="rad" data-v="${x[0]}" aria-pressed="${st.radius===x[0]}">${x[1]}</button>`).join('')}</div></div>
 <details><summary>Métiers à visiter</summary><div class="cats">${Object.keys(CAT).map(k=>`<button data-a="cat" data-v="${k}" aria-pressed="${!!st.cats[k]}">${CAT[k]}</button>`).join('')}</div><p class="mute">Coiffure et ongles sont décochés : petit ticket. Coche-les si tu veux.</p></details>`;
 if(st.busy)h+=`<p class="mute" aria-live="polite">${esc(st.busy)}</p>`;if(st.err)h+=`<p class="err" role="alert">${esc(st.err)}</p>`;
 if(st.pos&&!st.busy){
  h+=`<div class="bar"><div class="prog"><i style="width:${(dn/(dn+t.length||1))*100}%"></i></div><span class="mute">${dn} faites · ${t.length} restantes</span></div>`;
  if(!cur){h+=`<section class="card cur"><h2>Plus rien à visiter ici</h2><p>${st.found?'Tu as fait le tour de cette zone.':'Aucun commerce trouvé avec ces filtres.'} Élargis le rayon, ajoute des métiers ou appuie sur « Autour de moi » ailleurs.</p><button data-a="here">🔄 Relancer depuis ici</button></section>`}
  else{h+=card(cur,'En cours · société '+(dn+1),st.pos,true);
   h+=dirBox(cur);
   h+=`<textarea id="note" placeholder="Note : nom du patron, créneau pour repasser, ce qu'il a dit…" aria-label="Note">${esc(st.note)}</textarea>
   <div class="res"><button class="pri" data-a="res" data-v="rdv">✅ RDV pris</button><button data-a="res" data-v="rappel">🔁 À rappeler / repasser</button><button data-a="res" data-v="carte">🪪 Carte laissée</button><button data-a="res" data-v="absent">🚪 Patron absent</button><button data-a="res" data-v="refus">✖ Pas intéressé</button><button data-a="res" data-v="passe">⏭ Fermé / passer</button></div>
   <details open><summary>Que dire</summary>${pitch(cur)}</details></section>`;
   const nx=pick(cur,t.filter(s=>s.id!==cur.id));
   if(nx)h+=card(nx,'Ensuite',cur,false).replace(/<div class="row"[\s\S]*?<\/div>/,`<div class="row" style="margin-top:10px"><a class="btn gold" href="${mapsUrl(nx)}" target="_blank" rel="noopener">${st.mode==='walk'?'🚶':'🚗'} Y aller · ${fmtKm(dist(cur,nx))} depuis ici · ${eta(dist(cur,nx))} min</a></div>`)+'</section>'}
 }
 const ids=Object.keys(st.res);
 h+=`<section class="card"><div class="lab">Récap du jour</div>`+(ids.length?`<div class="list">${ids.sort((a,b)=>st.res[b].at-st.res[a].at).map(id=>{const r=st.res[id];return `<div class="li"><span>${esc(r.n)}${r.note?'<br><span class="mute">'+esc(r.note)+'</span>':''}</span><span class="tag ${RES[r.r][1]}">${RES[r.r][0]}</span></div>`}).join('')}</div>`:'<p class="mute">Aucune visite notée pour le moment.</p>')+
 `<div class="row" style="margin-top:10px"><button data-a="undo"${ids.length?'':' disabled'}>↶ Annuler la dernière</button><button data-a="copy"${ids.length?'':' disabled'}>Copier le récap</button><button data-a="reset"${ids.length?'':' disabled'}>Nouvelle journée</button></div><textarea id="recap" hidden readonly aria-label="Récap à copier"></textarea></section>`;
 h+=`<p class="mute">Commerces : OpenStreetMap, sans les chaînes et franchises. Les horaires y sont souvent absents : ouvre la fiche Google Maps pour les avis et horaires. Ta position sert uniquement à chercher les commerces autour.</p>`;
 const an=$('#note');if(an)st.note=an.value;const ad=$('#addr');const av=ad?ad.value:'';$('#app').innerHTML=h;if(av&&$('#addr'))$('#addr').value=av}
document.addEventListener('submit',e=>{const f=e.target.closest('[data-a="addr"]');if(f){e.preventDefault();geoAddr($('#addr').value)}});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='geo')geo();
 else if(a==='here'){if(st.pos)search(st.pos.lat,st.pos.lng,st.posLabel)}
 else if(a==='mode'){st.mode=b.dataset.v;save();render()}
 else if(a==='rad'){st.radius=b.dataset.v;save();render();if(st.pos)search(st.pos.lat,st.pos.lng,st.posLabel)}
 else if(a==='cat'){st.cats[b.dataset.v]=st.cats[b.dataset.v]?0:1;st.cur=null;save();render()}
 else if(a==='dir'){const s=st.stops.find(x=>x.id===st.cur);if(s)findDir(s)}
 else if(a==='pickdir'){const s=st.cur;st.dirs[s]=Object.assign({},st.dirs[s],{pick:b.dataset.v});save();render()}
 else if(a==='res'){const n=$('#note'),s=st.stops.find(x=>x.id===st.cur);if(!s)return;st.res[s.id]={r:b.dataset.v,note:n?n.value.trim():'',at:Date.now(),n:s.n,addr:s.addr,lat:s.lat,lng:s.lng};st.pos={lat:s.lat,lng:s.lng};st.posLabel=s.n;st.note='';st.cur=null;save();render();window.scrollTo(0,0)}
 else if(a==='undo'){const ids=Object.keys(st.res).sort((x,y)=>st.res[y].at-st.res[x].at);const id=ids[0];if(id){const r=st.res[id];if(!st.stops.find(s=>s.id===id))st.stops.push({id,n:r.n,cat:'garage',lat:r.lat,lng:r.lng,addr:r.addr||'',cp:'',tel:'',h:null});st.cur=id;st.note=r.note||'';delete st.res[id];save();render()}}
 else if(a==='reset'){if(b.dataset.sure){st.res={};st.stops=[];st.cur=null;st.pos=null;st.dirs={};save();render()}else{b.dataset.sure='1';b.textContent='Confirmer : tout effacer'}}
 else if(a==='copy'){const t=Object.keys(st.res).map(id=>{const r=st.res[id];return r.n+(r.addr?' ('+r.addr+')':'')+' : '+RES[r.r][0]+(r.note?' : '+r.note:'')}).join('\n');const ta=$('#recap');ta.value=t;ta.hidden=false;ta.select();try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Copié'},()=>{b.textContent='Sélectionné, copie à la main'})}catch(x){b.textContent='Sélectionné, copie à la main'}}
});
render();
</script></body></html>
