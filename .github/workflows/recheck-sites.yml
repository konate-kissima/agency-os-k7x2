name: Revérifier les sites réapparus
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = rapport seulement, 0 = corriger"
        default: "1"
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python recheck_sites.py
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY: ${{ github.event.inputs.dry || '1' }}
