name: Enrichissement des fiches
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre de fiches à traiter"
        default: "100"
      social_limit:
        description: "Fiches à repasser pour trouver Facebook / Instagram"
        default: "300"
      company_limit:
        description: "Fiches à compléter (année de création, secteur, effectif)"
        default: "400"
  schedule:
    - cron: "17 3 * * *"
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/enrich.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          LIMIT: ${{ github.event.inputs.limit || '100' }}
      - run: python scripts/enrich.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          MODE: social
          LIMIT: ${{ github.event.inputs.social_limit || '300' }}
          PAUSE: "0.5"
      - run: python scripts/enrich.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MODE: company
          LIMIT: ${{ github.event.inputs.company_limit || '400' }}
          PAUSE: "0.3"
